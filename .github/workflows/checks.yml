# Deterministic checks only: no model calls, no API key, no network beyond the
# checkout. Everything here is decidable from the text or by running a test.
#
# What is deliberately NOT here: the eval scenarios under skills/*/evals/.
# Those are model-graded and cost money per run, so they are non-deterministic
# and unsuited to a required check — a gate that goes red on sampling noise
# teaches people to override it. Run them on demand instead.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Each skill's references/ is generated from rules/ and never committed,
      # so the checks run against the tree an install would produce.
      - name: Generate shared-rule references
        run: bash scripts/refresh_shared_rules.sh

      - name: Skill structure and schema
        run: python3 scripts/check_skills.py

      - name: Shared rules are bundled and unmodified
        run: python3 scripts/check_shared_rules.py

      # Same reason as the path detector fixtures below: the check above runs
      # against a tree that is already wired correctly, so it is green whether
      # its guards work or not. These fixtures break the wiring on purpose, one
      # way per guard, and require the named guard to be what rejects each.
      - name: Shared rule guard fixtures
        run: python3 scripts/test_shared_rules.py

      - name: Permissions file shape
        run: python3 scripts/check_permissions.py

      - name: No machine-specific paths in skills
        run: python3 scripts/check_no_machine_paths.py

      - name: Path detector fixtures
        run: python3 scripts/test_no_machine_paths.py

      # run_evals.py makes no model calls, so nothing here grades anything - it
      # is the scaffolding that keeps the reader's packet and the grader's key
      # apart. Both its guards fail in the flattering direction (a leaked answer
      # reads as a clean sweep; an ungraded scenario reads as a pass), so the
      # fixtures are the only thing that says they work.
      - name: Eval runner guard fixtures
        run: python3 scripts/test_run_evals.py

      # Same reason as the locality fixtures below: this one shipped green over
      # the construction it exists to reject, so the fixtures gate the check.


      # Mutation battery: breaks each rule the corpus assertions protect and
      # requires the named assertion to go red. Four review rounds running
      # ended with a guard green over its own subject; this is what makes that
      # mechanical instead of remembered.

      # The fixtures run first on purpose: they assert the detector still
      # catches every construction a real violation has taken. The check
      # passing means nothing if the detector has stopped detecting.


      - name: Checkpoint capture tests
        run: bash skills/swarm/scripts/test-checkpoint-capture.sh

      # Warning-and-above deliberately. Info/style findings vary by shellcheck
      # build — SC2015 is reported by 0.9.0 and 0.10.0 and not by 0.11.0 — so
      # gating on them makes redness depend on whichever version the runner
      # ships rather than on the change. The one info finding here
      # (checkpoint-capture.sh's `A && B && C || { usage; }`) is intentional:
      # any missing argument must reach the usage block.
      - name: Shell scripts
        run: shellcheck --severity=warning bootstrap.sh skills/*/scripts/*.sh

      - name: Eval coverage reminder
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          bash scripts/eval_reminder.sh "origin/${{ github.base_ref }}"
