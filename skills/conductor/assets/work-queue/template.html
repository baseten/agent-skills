/* Generic conductor work queue (skills/conductor/work-queue.md). Layout: one reading column. Decisions you answer in place, replies to copy and post, then the run order, later items and done. A sticky bar sends everything you changed in one go. */

ol.mlist { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }

<script id="page-script">

    kids.push(h('div', { class: 'what' }, rich(it.what)));
    if (it.why) kids.push(h('div', { class: 'why' }, rich(it.why)));
    var lr = linkRow(it.links); if (lr) kids.push(lr);
    var changed = ticks.hasOwnProperty('item:' + it.id);
    return h('li', { class: (done ? 'is-done' : '') + (changed ? ' changed' : '') }, [box, h('div', null, kids)]);
  }

  function mergeRow(m) {
    var waiting = m.after && state.merge.some(function (x) { return x.pr === m.after && x.repo === m.repo; });
    var ready = !m.blockers.length && !(m.auto || []).length && !waiting;
    var pill = ready ? h('span', { class: 'pill ready', text: 'Ready to merge' })
      : waiting && !m.blockers.length && !(m.auto || []).length ? h('span', { class: 'pill wait', text: 'After #' + m.after })
      : h('span', { class: 'pill blocked', text: 'Not yet' });
    var chips = [
      h('span', { class: 'chip ok', text: 'Approved: ' + m.approvals.join(', ') }),
      h('span', { class: 'chip ' + (m.unresolved ? 'bad' : 'ok'), text: m.unresolved ? m.unresolved + ' unresolved' : 'Threads resolved' }),
      h('span', { class: 'chip ' + (m.ci === 'green' ? 'ok' : m.ci === 'red' ? 'bad' : 'warn'), text: m.ci === 'green' ? 'CI green' : m.ci === 'red' ? 'CI red' : m.ci === 'none' ? 'No checks read' : 'CI running' })
    ];
    if (m.needs_reply) chips.push(h('span', { class: 'chip warn', text: m.needs_reply + ' fixed, needs a reply' }));
    if (m.answered) chips.push(h('span', { class: 'chip', text: m.answered + (m.answered === 1 ? ' thread answered' : ' threads answered') }));
    if (waiting && m.blockers.length) chips.push(h('span', { class: 'chip warn', text: 'After #' + m.after }));
    var kids = [h('div', { class: 'mhead' }, [pill, h('a', { class: 'mpr', href: m.url, target: '_blank', rel: 'noopener', text: '#' + m.pr }), h('span', { class: 'mtitle', text: m.title })]),
      h('div', { class: 'chips' }, chips)];
    if (m.blockers.length) kids.push(h('ul', { class: 'blockers' }, m.blockers.map(function (b) { return h('li', null, rich(b)); })));
    if (m.note) kids.push(h('div', { class: 'why' }, rich(m.note)));
    var lr = prLinks(m); if (lr) kids.push(lr);
    return h('li', { class: 'mrow' + (ready ? ' is-ready' : '') }, kids);
  }

  function prLinks(p) {
    return linkRow(p.links, null, p.noIssue ? [h('span', { class: 'noissue', text: 'no linked issue' })] : null);
  }

  // Steps are read from the forge at each build; the page shows them and never ticks them.
  function prItem(p) {
    var next = -1;
    (p.steps || []).forEach(function (s, i) { if (next < 0 && !s.done) next = i; });
    var kids = [h('div', { class: 'mhead' }, [h('a', { class: 'mpr', href: p.url, target: '_blank', rel: 'noopener', text: '#' + p.pr }), h('span', { class: 'mtitle', text: p.title })]),
      h('ol', { class: 'steps', 'aria-label': 'Steps' }, (p.steps || []).map(function (s, i) {
        return h('li', { class: s.done ? 'done' : i === next ? 'next' : '', text: s.label });
      }))];
    var waitText = { team: 'Waiting on the team', held: 'Held in draft: nothing for you to do', draft: 'Draft: its run has not asked you to publish it', blocked: 'Approved, not ready to merge', unread: 'Draft awaiting your publish: its ready history is unread, so check it is not held' }[p.waitsOn];
    if (waitText) kids.splice(1, 0, h('div', { class: 'chips' }, [h('span', { class: 'chip', text: waitText })]));
    var lr = prLinks(p); if (lr) kids.push(lr);
    return h('li', { class: 'mrow' }, kids);
  }

  function refreshCard() {
    var r = state.refresh;
    if (!r || !r.ready || !r.prompt) return null;
    var pre = h('pre', { class: 'draft', id: 'restart-prompt', text: r.prompt });
    var btn = h('button', { type: 'button', class: 'copy', text: 'Copy restart prompt', onclick: function () {
      function flash(t) { btn.textContent = t; setTimeout(function () { btn.textContent = 'Copy restart prompt'; }, 2500); }
      try { navigator.clipboard.writeText(pre.textContent).then(function () { flash('Copied'); }, function () { var g = document.createRange(); g.selectNodeContents(pre); var x = window.getSelection(); x.removeAllRanges(); x.addRange(g); flash('Selected: press Ctrl/Cmd+C'); }); } catch (e) {}
    } });
    var kids = [h('div', { class: 'tier' }, [h('h2', { text: 'Ready for a refresh' })]),
      h('div', { class: 'card refresh' }, [
        h('p', { class: 'ctx', text: (r.reason ? r.reason + ' ' : '') + 'In the conductor session, type /clear, then paste this prompt. The session id, the page watch and the check-in stay the same.' }),
        h('div', { class: 'row' }, [btn, r.session ? h('a', { class: 'k ses', href: r.session, target: '_blank', rel: 'noopener', text: 'Conductor session' }) : null]),
        h('details', { class: 'posted' }, [h('summary', { text: 'Show the prompt' }), pre])
      ])];
    return h('section', { id: 'refresh' }, kids);
  }

  function sessionItem(se) {
    var done = isDone('session', se);
    var box = h('input', { type: 'checkbox', id: 'tick-session-' + se.id, 'aria-label': 'Archive: ' + se.title, disabled: !INTERACTIVE || mode !== 'ready' || sending || !!se.done,
      onchange: function (e) { toggle('session', se, e.target.checked); } });
    box.checked = done;
    var kids = [h('div', { class: 'what' }, rich(se.title))];
    if (se.why) kids.push(h('div', { class: 'why' }, rich(se.done ? 'Archive requested; the conductor is on it.' : se.why)));
    var lr = linkRow([{ k: 'ses', label: 'Open session', href: 'https://claude.ai/code/' + encodeURIComponent(se.id) }].concat(se.links || [])); if (lr) kids.push(lr);
    var changed = ticks.hasOwnProperty('session:' + se.id);
    return h('li', { class: (done ? 'is-done' : '') + (changed ? ' changed' : '') }, [box, h('div', null, kids)]);
  }

  function counts() {
    var answers = Object.keys(picks).filter(function (id) { return picks[id] && picks[id].choice; });
    var archives = Object.keys(ticks).filter(function (k) { return k.indexOf('session:') === 0 && ticks[k]; }).map(function (k) { return k.slice(8); });
    return { answers: answers, ticks: Object.keys(ticks), archives: archives };
  }

  function notice() {
    if (!INTERACTIVE) return h('div', { class: 'notice bad', text: 'Read-only view' + (state.readonlyReason ? ' (' + state.readonlyReason + ')' : '') + '. Answer decisions in the conductor session; nothing here reaches it.' });
    if (mode === 'readonly') return h('div', { class: 'notice bad', text: 'This view is read-only. Only the page owner can send answers or save ticks.' });
    if (mode === 'unavailable') return h('div', { class: 'notice bad', text: 'Saving isn’t available in this view. Open the page on claude.ai to answer.' });
    if (mode !== 'ready') return null;
    if (canSend === 'available') return h('div', { class: 'notice ok', text: 'Pick answers on as many cards as you like, then send them together. They reach the conductor within seconds.' });
    if (canSend === 'checking') return h('div', { class: 'notice', text: 'Checking whether the conductor can be reached…' });
    var why = canSend === 'no_session' ? 'no conductor session is watching this page right now; the conductor re-arms its watch at its next sweep'
      : canSend === 'writers_only' ? 'only the page’s owner can send to Claude; open it signed in to the account that owns it'
      : canSend === 'off' ? 'sending to Claude is off in this view; open the page on claude.ai, where the conductor publishes it with full comments'
      : 'sending to Claude isn’t available here (' + canSend + ')';
    return h('div', { class: 'notice bad', text: 'Answers will save, but ' + why + '. The conductor will put saved answers to you to confirm; they are not acted on from the page alone.' });
  }

  var bar = h('div', { class: 'sendbar', hidden: true });
  function renderBar() {
    var c = counts();
    var n = c.answers.length, t = c.ticks.length;
    if ((!n && !t) || mode !== 'ready' || !INTERACTIVE) { bar.hidden = true; return; }
    bar.hidden = false;
    var parts = [];
    if (n) parts.push(n + (n === 1 ? ' answer' : ' answers'));
    if (t) parts.push(t + (t === 1 ? ' tick' : ' ticks'));
    var av = c.archives.length;
    if (av) parts.push(av + (av === 1 ? ' session to archive' : ' sessions to archive'));
    var label = sending ? 'Sending…' : (n || av) ? 'Send to conductor' : 'Save ticks';
    var kids = [h('span', { class: 'sum', text: parts.join(' · ') + ' not sent yet' }),
      h('button', { type: 'button', class: 'send', id: 'send-all', disabled: sending, onclick: sendAll, text: label })];
    if (sendError) kids.splice(1, 0, h('span', { class: 'err', text: sendError }));
    bar.replaceChildren(h('div', { class: 'in' }, kids));
  }

  function render() {
    var focused = document.activeElement && document.activeElement.id;
    var open = state.decisions.filter(function (d) { return d.status === 'open'; });
    var sent = state.decisions.filter(function (d) { return d.status === 'answered'; });
    var done = state.decisions.filter(function (d) { return d.status === 'done'; });
    var replies = state.replies;
    var postedCount = replies.filter(function (r) { return isDone('reply', r); }).length;
    // Needs you items keep the report's groups, in the order the build wrote them;
    // only items with no group, which the report puts at low urgency, wait for time.
    var later = state.items.filter(function (i) { return !i.group; });
    var groups = [];
    state.items.forEach(function (i) { if (i.group && groups.indexOf(i.group) < 0) groups.push(i.group); });
    var grouped = groups.map(function (g) {
      return h('section', null, [h('div', { class: 'tier' }, [h('h2', { text: g })]),
        h('ol', { class: 'list' }, state.items.filter(function (i) { return i.group === g; }).map(workItem))]);
    });
    var wrap = h('div', { class: 'wrap' }, [
      h('header', null, [h('h1', { text: TITLE }),
        h('div', { class: 'meta', text: 'Read ' + fmt(state.updated) + ' by the conductor\u2019s last sweep · next check-in ' + (state.nextCheckin || '') + ' · ' + open.length + ' decisions open · ' + (replies.length - postedCount) + ' replies to post' }),
        notice()]),
      refreshCard(),
      state.merge.length || state.prs.length ? h('section', { id: 'prs' }, [h('div', { class: 'tier' }, [h('h2', { text: 'Your PRs' }), h('p', { text: 'Approved PRs with review settled first, then every other open PR of a run. Steps are read from GitHub at each check-in.' })]),
        h('ol', { class: 'mlist' }, state.merge.map(mergeRow).concat(state.prs.map(prItem)))]) : null,
      h('section', { id: 'decisions' }, [h('div', { class: 'tier' }, [h('h2', { text: 'Decisions waiting on you' }), h('p', { text: 'Recommended options are marked. A note is optional.' })]),
        open.length ? h('div', { class: 'cards' }, open.map(decisionCard)) : h('div', { class: 'empty', text: 'Nothing waiting on you.' })]),
      sent.length ? h('section', null, [h('div', { class: 'tier' }, [h('h2', { text: 'Sent to the conductor' })]), h('div', { class: 'cards' }, sent.map(decisionCard))]) : null,
      replies.length ? h('section', { id: 'replies' }, (function () {
        var todo = replies.filter(function (r) { return !r.done || ticks.hasOwnProperty('reply:' + r.id); });
        var posted = replies.filter(function (r) { return r.done && !ticks.hasOwnProperty('reply:' + r.id); });
        var kids = [h('div', { class: 'tier' }, [h('h2', { text: 'Replies to post' }), h('p', { text: 'Copy, open the thread, paste and post, then tick. Posted replies fold away and drop off once their PR merges or closes.' })])];
        kids.push(todo.length ? h('ol', { class: 'list' }, todo.map(replyItem)) : h('div', { class: 'empty', text: 'Nothing to post.' }));
        if (posted.length) kids.push(h('details', { class: 'posted' }, [h('summary', { text: 'Posted (' + posted.length + ')' }), h('ol', { class: 'list' }, posted.map(replyItem))]));
        return kids;
      })()) : null,
      state.sessions.length ? h('section', { id: 'sessions' }, [h('div', { class: 'tier' }, [h('h2', { text: 'Sessions to archive' }), h('p', { text: 'Finished sessions with nothing left to do. Tick the ones to archive and send; the conductor archives them.' })]),
        h('ol', { class: 'list' }, state.sessions.map(sessionItem))]) : null,
    ].concat(grouped, [
      later.length ? h('section', null, [h('div', { class: 'tier' }, [h('h2', { text: 'When there’s time' })]), h('ol', { class: 'list' }, later.map(workItem))]) : null,
      done.length ? h('section', null, [h('div', { class: 'tier' }, [h('h2', { text: 'Decisions done' })]), h('div', { class: 'cards' }, done.map(decisionCard))]) : null,
      state.doneRecent.length ? h('section', null, [h('div', { class: 'tier' }, [h('h2', { text: 'Done recently' })]), h('ul', { class: 'donelist' }, state.doneRecent.map(function (t) { return h('li', null, rich(t)); }))]) : null
    ]));
    app.replaceChildren(wrap, bar);
    renderBar();
    if (focused) { var f = document.getElementById(focused); if (f) f.focus(); }
  }

  function clean(s) { return String(s || '').replace(/[\u0000-\u0008\u000b-\u001f\u007f]/g, ''); }

  // Plain text under 4 KiB that always carries every answer whole: card id, option id
  // and label. When it would be too long, prose is shortened level by level — never an
  // answer line cut off, which the conductor could not match to its card.
  var LEVELS = [{ q: 160, l: 160, n: 600, t: 80 }, { q: 80, l: 80, n: 200, t: 40 }, { q: 40, l: 60, n: 0, t: 0 }, { q: 0, l: 40, n: 0, t: 0 }];
  function commentText(next, ids, at, aids) {
    aids = aids || [];
    var text = '';
    for (var i = 0; i < LEVELS.length; i++) {
      var L = LEVELS[i];
      var lines = ['[Work queue] ' + ids.length + (ids.length === 1 ? ' answer' : ' answers') + (aids.length ? ' and ' + aids.length + ' sessions to archive' : '') + ' sent at ' + at + ':'];
      ids.forEach(function (id) {
        var d = find(next.decisions, id);
        var q = L.q ? clean(d.question).slice(0, L.q) + ' ' : '';
        var line = '- ' + q + '(' + id + '): ' + clean(optLabel(d, d.answer.choice)).slice(0, L.l) + ' (' + d.answer.choice + ')';
        if (d.answer.note) line += L.n ? '\n  Note: ' + clean(d.answer.note).slice(0, L.n) : '\n  Note: saved on the page';
        lines.push(line);
      });
      if (aids.length) lines.push('Archive: ' + aids.map(function (id) { var se = find(next.sessions, id); return id + (se && L.t ? ' (' + clean(se.title).slice(0, L.t) + ')' : ''); }).join(', '));
      lines.push('Everything is also saved on the page.');
      text = lines.join('\n');
      if (new Blob([text]).size <= 3900) break;
    }
    return text;
  }

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function buildDoc(next) {
    var style = document.getElementById('page-style').textContent;
    var script = document.getElementById('page-script').textContent;
    var json = JSON.stringify(next).replace(/</g, '\\u003c');
    var close = '</' + 'script>';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      '<title>' + esc(TITLE) + '</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link rel="stylesheet" href="' + FONTS + '">\n' +
      '<style id="page-style">' + style + '</style>\n' +
      '<div id="app"><div class="wrap"><header><h1>' + esc(TITLE) + '</h1><div class="meta">Loading…</div></header></div></div>\n' +
      '<script id="state" type="application/json">' + json + close + '\n' +
      '<script id="page-script">' + script + close + '\n</body></html>';
  }

  function sendAll() {
    if (!artifactNs || sending) return;
    var c = counts();
    if (!INTERACTIVE || (!c.answers.length && !c.ticks.length)) return;
    var at = new Date().toISOString();
    var next = JSON.parse(JSON.stringify(state));
    c.answers.forEach(function (id) {
      var d = find(next.decisions, id);
      d.status = 'answered';
      d.answer = { choice: picks[id].choice, note: clean(picks[id].note || '').trim(), at: at };
    });
    c.ticks.forEach(function (key) {
      var kind = key.split(':')[0], id = key.slice(kind.length + 1);
      var obj = find(kind === 'reply' ? next.replies : kind === 'session' ? next.sessions : next.items, id);
      if (obj) { obj.done = ticks[key]; obj.doneAt = ticks[key] ? at : null; }
    });
    var wake = c.answers.length || c.archives.length;
    var anchorP = wake && commentsNs && canSend === 'available' ? commentsNs.anchorFor(document.getElementById(c.answers.length ? 'decisions' : 'sessions')) : null;
    sending = true; sendError = ''; render();
    var notified = anchorP
      ? anchorP.then(function (anchor) { return commentsNs.sendToClaude({ anchor: anchor, text: commentText(next, c.answers, at, c.archives) }); })
          .then(function (r) { return { ok: true, threadId: r.threadId }; }, function (e) { return { ok: false, code: (e && e.code) || 'error' }; })
      : Promise.resolve(wake ? { ok: false, code: canSend } : null);
    notified.then(function (r) {
      if (r) c.answers.forEach(function (id) { var d = find(next.decisions, id); d.answer.messaged = r.ok; if (r.ok) d.answer.threadId = r.threadId; else d.answer.messageError = r.code; });
      return artifactNs.publish(buildDoc(next));
    }).then(function () {
      try { sessionStorage.removeItem(KEY); } catch (e) {}
    }, function (err) {
      sending = false;
      var code = err && err.code;
      if (code === 'conflict') sendError = 'The page was just updated. It’s reloading with your choices kept; press Send again.';
      else if (code === 'capability_removed') mode = 'unavailable';
      else if (code === 'not_writer' || code === 'not_granted' || code === 'capability_disabled') mode = 'readonly';
      else if (code === 'rate_limited') sendError = 'Too many saves just now. Wait a minute and send again.';
      else sendError = 'Couldn’t save (' + (code || 'error') + '). Send again.';
      render();
    });
  }

  function refreshCanSend() {
    if (!commentsNs || typeof commentsNs.canSendToClaude !== 'function') { canSend = commentsNs ? 'unsupported' : 'unavailable'; render(); return; }
    commentsNs.canSendToClaude().then(function (v) { canSend = String(v); render(); }, function (e) {
      canSend = (e && e.code) || 'error';
      if (canSend === 'capability_removed') mode = 'unavailable';
      render();
    });
  }

  render();
  var cl = window.claude;
  if (INTERACTIVE && cl && typeof cl.use === 'function') {
    cl.use('artifact').then(function (x) { artifactNs = x; mode = x && canSend !== 'capability_removed' ? 'ready' : 'unavailable'; render(); }, function () { mode = 'unavailable'; render(); });
    cl.use('comments').then(function (x) { commentsNs = x; refreshCanSend(); }, function () { commentsNs = null; refreshCanSend(); });
    window.addEventListener('focus', refreshCanSend);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshCanSend(); });
  } else { mode = 'unavailable'; render(); }
})();
</script>
